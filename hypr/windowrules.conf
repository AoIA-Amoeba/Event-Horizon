# ----Window Rules----

# Floating terminal (dashboard)
windowrulev2 = float, class:^(kitty)$
windowrulev2 = opacity 0.85, class:^(kitty)$
windowrulev2 = size 80% 70%, class:^(kitty)$
windowrulev2 = center, class:^(kitty)$

# Rofi launcher
windowrulev2 = float, class:^(rofi)$
windowrulev2 = opacity 0.9, class:^(rofi)$
windowrulev2 = center, class:^(rofi)$

# wlogout
windowrulev2 = float, class:^(wlogout)$
windowrulev2 = opacity 0.95, class:^(wlogout)$
windowrulev2 = center, class:^(wlogout)$

# hyprlock
windowrulev2 = float, class:^(hyprlock)$
windowrulev2 = opacity 1.0, class:^(hyprlock)$

# Picture-in-picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = opacity 0.95, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$

# File manager
windowrulev2 = float, class:^(nautilus)$
windowrulev2 = opacity 0.9, class:^(nautilus)$

# Firefox PiP
windowrulev2 = float, title:^(Firefox.*Picture-in-Picture)$
windowrulev2 = pin, title:^(Firefox.*Picture-in-Picture)$
