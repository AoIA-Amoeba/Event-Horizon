# kitty - Black Hole Rice

font_family JetBrainsMono Nerd Font
font_size 12
bold_font auto
italic_font auto
bold_italic_font auto

background #0a0d1a
foreground #dfe6f5
selection_background #8fc4ff
selection_foreground #0a0d1a
cursor #8fc4ff
cursor_text_color #0a0d1a
url_color #8fc4ff

# Opacity and blur
background_opacity 0.92
background_blur 1

# Window padding
window_padding_width 12
window_margin_width 8

# Border
active_border_color #8fc4ff
inactive_border_color #1a1f2e
bell_border_color #ff8a4c

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background #8fc4ff
active_tab_foreground #0a0d1a
inactive_tab_background #0a0d1a
inactive_tab_foreground #8a92a8

# Color scheme
color0  #1a1f2e
color1  #f87171
