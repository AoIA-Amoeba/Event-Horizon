# MPD Configuration
music_directory "~/Music"
playlist_directory "~/.config/mpd/playlists"
db_file "~/.config/mpd/database"
log_file "~/.config/mpd/log"
pid_file "~/.config/mpd/pid"
state_file "~/.config/mpd/state"
sticker_file "~/.config/mpd/sticker.sql"

# Audio output
audio_output {
    type "pulse"
    name "PulseAudio"
}

# Visualizer
audio_output {
    type "fifo"
    name "Visualizer"
    path "/tmp/mpd.fifo"
    format "44100:16:2"
}

# Auto update
auto_update "yes"
auto_update_depth "3"

# Zero buffer
zeroconf_enabled "yes"
zeroconf_name "MPD"

# Port
port "6600"
